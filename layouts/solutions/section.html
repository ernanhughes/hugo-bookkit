{{ define "main" }}
<section class="bookkit-prose">
  <header class="bookkit-page-header">
    <h1>{{ .Title }}</h1>
    {{ with .Description }}
      <p>{{ . }}</p>
    {{ end }}
  </header>

  {{ .Content }}

  {{ range .RegularPages.ByWeight }}
    <article>
      <h2>
        <a href="{{ .RelPermalink }}">{{ .Title }}</a>
      </h2>

      {{ with .Description }}
        <p>{{ . }}</p>
      {{ end }}
    </article>
  {{ end }}
</section>
{{ end }}
