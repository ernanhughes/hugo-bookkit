{{- $cfg := .Site.Params.bookkit -}}
{{- if $cfg.features.math -}}
  {{- $src := $cfg.mathjaxPath | default "https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" -}}
  <script>
    window.MathJax = window.MathJax || {
      tex: { inlineMath: [['\\(', '\\)'], ['$', '$']], displayMath: [['\\[', '\\]'], ['$$', '$$']] },
      options: { skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code'] }
    };
  </script>
  <script async src="{{ $src }}"></script>
{{- end }}
