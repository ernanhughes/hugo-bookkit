name: BookKit CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-example:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.23.x'

      - name: Set up Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: latest
          extended: false

      - name: Build imported-module example
        run: hugo --source exampleSite --minify --panicOnWarning
