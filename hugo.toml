[module]
  [module.hugoVersion]
    min = "0.146.0"
    extended = false

[params.bookkit]
  brandLabel = "Book"
  bookSection = "books"
  homeBook = ""
  reader = true
  progress = true
  accent = "#3978c5"
  contentWidth = "760px"
  coverRoot = "/images/books"
  storagePrefix = "hugo-bookkit:progress:"
  showStatus = true
  showStores = true
  showChapterList = true
  bookExtraPartial = ""
  chapterBeforeContentPartial = ""

  [params.bookkit.features]
    math = true
    mermaid = true
    research = false

  # R21B: reusable reader-facing research defaults. Consuming sites
  # enable the feature and point at their R19 dossier tree; trusted API
  # enhancement stays opt-in. (Output formats cannot ship through module
  # configuration, so sites also declare [outputFormats.Research]; see
  # README and exampleSite/hugo.toml.)
  [params.bookkit.research]
    dataRoot = "content/research/chapters"
    apiBase = ""
    refreshUI = false
    warnMissingDossier = false

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
    [markup.goldmark.extensions]
      [markup.goldmark.extensions.passthrough]
        enable = true
        [markup.goldmark.extensions.passthrough.delimiters]
          block = [['\[', '\]'], ['$$', '$$']]
          inline = [['\(', '\)'], ['$', '$']]
